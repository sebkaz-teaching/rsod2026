  - syllabus_id: W5
    current_files: [lectures/wyklad5.qmd]
    legacy_files: [../rsod/lectures/wyklad5.qmd]
    status: "Podstawy transakcji, ACID i izolacji są obecne."
    next_step: "Dodać demonstrację na dwóch połączeniach PostgreSQL z danymi startowymi, kolejnością poleceń i oczekiwanymi wynikami."

legacy_lab_reuse:
  - file: ../rsod/cwiczenia/cw1.ipynb
    contents: "Pliki, SQLite, DDL i normalizacja."
    use_for: [L1, L2]
    adaptation: "Materiał pomocniczy; opracować jawne zadanie diagramowe na 4 godziny i wersję fizyczną PostgreSQL."
  - file: ../rsod/cwiczenia/cw2.ipynb
    contents: "PostgreSQL, pgAdmin, zapytania, podzapytania, indeksy i EXPLAIN ANALYZE."
    use_for: [L2, L3, L4]
    adaptation: "Sprawdzić kompletność schematu i danych wejściowych; ujednolicić z zadaniami edycji 2026."
  - file: ../rsod/cwiczenia/cw3.qmd
    contents: "Złączenia, DML, agregacje, podzapytania, CTE, widoki, funkcje okienkowe i operacje zbiorowe."
    use_for: [L3, L4]
    adaptation: "Wybrać zadania podstawowe i dodatkowe, przypisać oczekiwane wyniki oraz operacje algebry relacyjnej."
  - file: ../rsod/cwiczenia/cw4.qmd
    contents: "PL/pgSQL: DO, zmienne, IF, pętle, funkcje, triggery i zgłaszanie wyjątków."
    use_for: [W4, L5]
    adaptation: "Uzupełnić przechwytywanie wyjątków; triggery traktować jako rozszerzenie."
    issue: "Opis SELECT INTO błędnie zapowiada błąd przy wielu wierszach bez STRICT. W PL/pgSQL taki SELECT wybiera pierwszy wiersz; wymaganie dokładnie jednego wyniku wymaga INTO STRICT."

next_steps:
  - "Wykorzystać istniejące materiały rsod, zamiast opracowywać cały kurs od zera."
  - "Przygotować spójny schemat i dane PostgreSQL, instrukcje dla studentów oraz rozwiązania tylko dla prowadzącego."
  - "Przed publikacją wykładów 4 i 5 usunąć lub przenieść stare testy początkowe zgodnie z ustaleniem jednego testu końcowego."
  - "Zweryfikować wykonywalność przykładów w docelowym systemie; przegląd treści nie zastępuje uruchomienia SQL."

