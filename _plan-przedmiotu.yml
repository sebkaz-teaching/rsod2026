purpose: "Program przekazany przez prowadzącego, pokrycie materiałem i plan wykorzystania poprzedniej edycji."
source: "Ustalenia z prowadzącym z 22 października 2026."

organization:
  lab_database: PostgreSQL
  lab_client: pgAdmin
  previous_arrangement: "Dwa ostatnie terminy laboratoryjne po 8 godzin; łącznie 16 godzin."
  lab_dates: null
  remaining_lab_hours_distribution: null
