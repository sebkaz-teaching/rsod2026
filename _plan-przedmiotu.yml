  note: "Numery tematów programu nie oznaczają automatycznie numerów istniejących plików wykładów."

syllabus:
  lectures:
    - id: W1
      title: "Ogólna charakterystyka baz danych"
      topics: ["Baza danych a system zarządzania bazą danych", "Zadania SZBD", "Rodzaje baz danych"]
    - id: W2
      title: "Struktura logiczna relacyjnych baz danych"
      topics: ["Encje, atrybuty i klucze", "Rodzaje związków", "SQL: tworzenie i modyfikowanie tabel"]
    - id: W3
      title: "Operowanie na danych za pomocą SQL"
      topics: ["Wyszukiwanie danych", "Dodawanie danych", "Kasowanie danych"]
      suggested_complement: "Aktualizacja danych za pomocą UPDATE."
    - id: W4
      title: "Podstawy języka proceduralnego PL/SQL"
      topics: ["Charakterystyka rozszerzenia proceduralnego", "Bloki", "Zmienne", "Instrukcje warunkowe", "Pętle", "Obsługa wyjątków"]
    - id: W5
      title: "Przetwarzanie transakcyjne"
      suggested_topics: ["Transakcja i ACID", "COMMIT i ROLLBACK", "SAVEPOINT", "Współbieżność", "Poziomy izolacji"]
  labs:
    - id: L1
      title: "Tworzenie diagramów logicznego modelu danych z wykorzystaniem modelu encji"
      hours: 4
      expected_result: "Diagram encji, atrybutów, kluczy i związków wraz z krotnościami oraz uzasadnieniem reguł."
    - id: L2
      title: "Projektowanie fizycznego modelu w PostgreSQL"
      hours: null
      expected_result: "Skrypt tworzący tabele, typy i ograniczenia; dane próbne oraz próby naruszenia integralności."
    - id: L3
      title: "Podstawowe operacje algebry relacyjnej w SQL"
      hours: null
      expected_result: "Selekcja, projekcja, złączenia i operacje zbiorowe; wyjaśnienie roli duplikatów i DISTINCT."
    - id: L4
      title: "Zaawansowane wyszukiwanie danych i optymalizacja zapytań"
      hours: null
      expected_result: "Podzapytania, agregacje i porównanie planów EXPLAIN ANALYZE przed dodaniem indeksu i po nim."
    - id: L5
      title: "Funkcje języka PL/SQL"
      hours: null
      expected_result: "Funkcja z parametrami, wynikiem i obsługą błędów; testy danych poprawnych i niepoprawnych."

procedural_language:
  syllabus_name: PL/SQL
  lecture_dialect: "PostgreSQL PL/pgSQL"
  lab_dialect: "PostgreSQL PL/pgSQL"
  decision: "Prowadzący wybrał jedną wersję PostgreSQL dla nowej części wykładowej 2026."
  audience: "Osoby początkujące; małe przykłady w pgAdmin, bez szczegółów implementacji silnika."
  scope: "Wykłady 4 i 5 oraz nowe laboratoria; wcześniejsze pokazy SQLite nie są przepisywane wstecz."
  syllabus_note: "Zachowano nazwę PL/SQL w przytoczonym programie; realizacja praktyczna używa PL/pgSQL."
  legacy_note: "Stary rsod zawiera Oracle na wykładzie i PL/pgSQL na laboratorium; wymaga adaptacji przy ponownym użyciu."

