  - syllabus_id: W3
    current_files: [lectures/wyklad2.qmd, lectures/wyklad3.qmd]
    legacy_files: [../rsod/lectures/wyklad2.qmd]
    status: "Polecenia są obecne, lecz materiał jest rozłożony między wykładami."
    next_step: "Powiązać SELECT, INSERT, UPDATE i DELETE z jednym wykonywalnym zestawem laboratoryjnym PostgreSQL."
  - syllabus_id: W4
    current_files: [lectures/wyklad4.qmd]
    legacy_files: [../rsod/lectures/wyklad4.qmd, ../rsod/cwiczenia/cw4.qmd]
    status: "Wykład 4 dostosowany do PL/pgSQL: bloki, zmienne, IF, FOR, WHILE, tabela, funkcja i obsługa naruszenia CHECK."
